name: Build ImmortalWrt (Ultimate DD Edition)

on:
  watch:
    types: [started]
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: .config
  MAKE_JOBS: -j$(nproc)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Ultimate Environment Setup (Clean + Swap + tmpfs)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo ">>> 1. Clean disk space"
        df -h

        # 1. Remove pre-installed garbage (free 40GB+)
        sudo rm -rf /usr/lib/jvm /usr/local/lib/android /usr/local/share/powershell
        sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/share/boost
        sudo rm -rf /opt/hostedtoolcache

        # 2. 【终极修复】使用 dd 创建 Swap，彻底解决 Text file busy
        sudo swapoff -a || true
        sudo rm -f /swapfile
        echo ">>> Creating 30G Swap with dd (please wait)..."
        sudo dd if=/dev/zero of=/swapfile bs=1M count=30720 status=progress
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

        # 3. 【关键修复】在用户有权限的目录下创建 tmpfs，避免 Permission denied
        # 不再尝试在根目录 / 下创建文件夹
        mkdir -p $GITHUB_WORKSPACE/tmpfs
        sudo mount -t tmpfs -o size=100% tmpfs $GITHUB_WORKSPACE/tmpfs
        sudo chmod 777 $GITHUB_WORKSPACE/tmpfs
        # 4. 验证环境
        echo ">>> Swap 状态:"
        free -h
        echo ">>> 磁盘空间:"
        df -h
        echo ">>> tmpfs 挂载点:"
        mount | grep tmpfs

    - name: Clone Source Code to tmpfs
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH /tmpfs/openwrt
        cd $GITHUB_WORKSPACE/tmpfs/openwrt
        cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
        echo ">>> Injecting custom IP: 192.168.1.129"
        sed -i 's/192.168.1.1/192.168.1.129/g' package/base-files/files/bin/config_generate
        sed -i 's/192.168.1.1/192.168.1.129/g' package/base-files/luci2/bin/config_generate || true

    - name: Download Feeds & Compile
      run: |
        cd $GITHUB_WORKSPACE/tmpfs/openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        make download -j8
        make -j$(nproc) || make -j1 V=s

    - name: Extract Firmware
      run: |
        mkdir -p /tmpfs/firmware
        cp $GITHUB_WORKSPACE/tmpfs/openwrt/bin/targets/*/*/*.bin /tmpfs/firmware/ || true
        cp $GITHUB_WORKSPACE/tmpfs/openwrt/bin/targets/*/*/*.img.gz /tmpfs/firmware/ || true
        cp $GITHUB_WORKSPACE/tmpfs/openwrt/bin/targets/*/*/*.iso /tmpfs/firmware/ || true
        cp $GITHUB_WORKSPACE/tmpfs/openwrt/bin/targets/*/*/*.vmdk /tmpfs/firmware/ || true
        cp $GITHUB_WORKSPACE/tmpfs/openwrt/.config /tmpfs/firmware/build.config

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt-Firmware-Ultimate
        path: $GITHUB_WORKSPACE/tmpfs/firmware/*
